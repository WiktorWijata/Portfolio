name: Pipeline

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [dev, prod]

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/wiktorwijata/portfolio-web

jobs:
  resolve-env:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
    steps:
      - name: Resolve environment
        id: resolve
        run: |
          echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT

  push:
    needs: resolve-env
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Deployment/Docker/Dockerfiles/Portfolio.Web.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ needs.resolve-env.outputs.environment }}-latest
            ${{ env.IMAGE }}:${{ needs.resolve-env.outputs.environment }}-${{ github.sha }}

  deploy:
    needs: [resolve-env, push]
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-env.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Copy docker-compose to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "Deployment/Docker/docker-compose.yml"
          target: /opt/environments/${{ vars.ENV_NAME }}/apps/portfolio
          strip_components: 2

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/environments/${{ vars.ENV_NAME }}/apps/portfolio
            cat > .env <<EOF
            ENV_NAME=${{ vars.ENV_NAME }}
            WEB_TAG=${{ needs.resolve-env.outputs.environment }}-latest
            ASPNETCORE_ENVIRONMENT=${{ vars.ASPNETCORE_ENVIRONMENT }}
            PROXY_NETWORK=${{ vars.PROXY_NETWORK }}
            EOF
            docker compose pull
            docker compose up -d
            docker image prune -f
