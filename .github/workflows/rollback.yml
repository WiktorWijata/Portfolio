name: Rollback

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Środowisko'
        required: true
        type: choice
        options: [dev, prod]
      image_tag:
        description: 'Tag obrazu (np. dev-abc1234567890abcdef lub prod-abc1234567890abcdef)'
        required: true

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: SSH rollback na VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/environments/${{ vars.ENV_NAME }}/apps/portfolio
            sed -i "s/^WEB_TAG=.*/WEB_TAG=${{ github.event.inputs.image_tag }}/" .env
            docker compose pull
            docker compose up -d
            docker image prune -f
