name: Rollback

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Środowisko'
        required: true
        type: choice
        options: [dev, prod]
      image:
        description: 'Obraz do rollbacku'
        required: true
        type: choice
        options: [web, api, db-migrator]
      image_tag:
        description: 'Tag obrazu (np. dev-abc1234567890abcdef lub prod-abc1234567890abcdef)'
        required: true

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Resolve .env variable name
        id: resolve
        run: |
          case "${{ github.event.inputs.image }}" in
            web) echo "var_name=WEB_TAG" >> $GITHUB_OUTPUT ;;
            api) echo "var_name=API_TAG" >> $GITHUB_OUTPUT ;;
            db-migrator) echo "var_name=MIGRATOR_TAG" >> $GITHUB_OUTPUT ;;
          esac

      - name: SSH rollback na VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/environments/${{ github.event.inputs.environment }}/apps/portfolio
            sed -i "s/^${{ steps.resolve.outputs.var_name }}=.*/${{ steps.resolve.outputs.var_name }}=${{ github.event.inputs.image_tag }}/" .env
            docker compose pull
            docker compose up -d
            docker image prune -f
